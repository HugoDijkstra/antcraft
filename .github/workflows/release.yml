name: Build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-configuration-cache

      - name: Find the jar
        id: jar
        run: |
          JAR=$(ls build/libs/antcraft-*.jar | grep -v -- '-sources' | head -1)
          VERSION=$(basename "$JAR" .jar | sed 's/^antcraft-//')
          sha256sum "$JAR" | cut -d' ' -f1 > "$JAR.sha256"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: antcraft-${{ steps.jar.outputs.version }}
          path: |
            ${{ steps.jar.outputs.jar }}
            ${{ steps.jar.outputs.jar }}.sha256

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.jar.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            "${{ steps.jar.outputs.jar }}" "${{ steps.jar.outputs.jar }}.sha256" \
            --title "AntCraft ${{ steps.jar.outputs.version }}" \
            --notes "$(git log -1 --pretty=%B)"
