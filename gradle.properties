# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
# The full version is <mod_version_base>.<number of git commits> (see build.gradle), so a local
# build and the GitHub release of the same commit carry the same version.
mod_version_base=1.0
group=dev.antcraft

# Dependencies
fabric_api_version=0.165.2+26.3
modmenu_version=21.0.0
